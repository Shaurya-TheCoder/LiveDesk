<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 665" width="1200" height="665" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="665" fill="#ffffff"/>

  <text x="30" y="36" font-size="22" font-weight="600" fill="#222">LiveDesk architecture</text>
  <text x="30" y="56" font-size="13" fill="#666">Real-time helpdesk: Spring Boot + STOMP WebSockets, PostgreSQL, Redis, React</text>

  <!-- Clients -->
  <rect x="30" y="90" width="200" height="105" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.2"/>
  <text x="130" y="122" text-anchor="middle" font-size="15" font-weight="600" fill="#0C447C">Customer</text>
  <text x="130" y="145" text-anchor="middle" font-size="12" fill="#185FA5">React, no account needed</text>
  <text x="130" y="165" text-anchor="middle" font-size="12" fill="#185FA5">session token + recovery code</text>

  <rect x="30" y="250" width="200" height="105" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.2"/>
  <text x="130" y="282" text-anchor="middle" font-size="15" font-weight="600" fill="#0C447C">Agent / Admin</text>
  <text x="130" y="305" text-anchor="middle" font-size="12" fill="#185FA5">React dashboards</text>
  <text x="130" y="325" text-anchor="middle" font-size="12" fill="#185FA5">JWT login (role in claims)</text>

  <!-- Client arrows -->
  <line x1="230" y1="135" x2="308" y2="135" stroke="#555" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <polyline points="230,302 262,302 262,165 308,165" fill="none" stroke="#555" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>

  <!-- Backend container -->
  <rect x="290" y="80" width="610" height="545" rx="14" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.2"/>
  <text x="310" y="104" font-size="12" font-weight="600" fill="#5F5E5A" letter-spacing="0.5">SPRING BOOT BACKEND  (port 3030)</text>

  <!-- Security -->
  <rect x="310" y="115" width="570" height="62" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.2"/>
  <text x="595" y="141" text-anchor="middle" font-size="14" font-weight="600" fill="#633806">Security filter chain</text>
  <text x="595" y="162" text-anchor="middle" font-size="12" fill="#854F0B">JwtAuthenticationFilter  ·  SessionTokenAuthenticationFilter</text>

  <!-- Controllers / WebSocket -->
  <rect x="310" y="205" width="275" height="78" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
  <text x="447" y="231" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">REST controllers</text>
  <text x="447" y="252" text-anchor="middle" font-size="12" fill="#0F6E56">/api/auth  ·  /api/v1  ·  /api/admin</text>
  <text x="447" y="270" text-anchor="middle" font-size="11" fill="#0F6E56">validation + global exception handler</text>

  <rect x="605" y="205" width="275" height="78" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
  <text x="742" y="231" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">WebSocket (STOMP)</text>
  <text x="742" y="252" text-anchor="middle" font-size="12" fill="#0F6E56">/ws  ·  /chat/{ticketId}  ·  typing</text>
  <text x="742" y="270" text-anchor="middle" font-size="11" fill="#0F6E56">interceptor: auth + agent presence</text>

  <!-- arrows security -> controllers -->
  <line x1="447" y1="177" x2="447" y2="203" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="742" y1="177" x2="742" y2="203" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Services container -->
  <rect x="310" y="312" width="570" height="140" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
  <text x="595" y="333" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">Services (business logic)</text>

  <rect x="322" y="344" width="178" height="40" rx="6" fill="#ffffff" stroke="#AFA9EC"/>
  <text x="411" y="369" text-anchor="middle" font-size="13" fill="#3C3489">TicketService</text>
  <rect x="511" y="344" width="178" height="40" rx="6" fill="#ffffff" stroke="#AFA9EC"/>
  <text x="600" y="369" text-anchor="middle" font-size="13" fill="#3C3489">RoutingService</text>
  <rect x="700" y="344" width="168" height="40" rx="6" fill="#ffffff" stroke="#AFA9EC"/>
  <text x="784" y="369" text-anchor="middle" font-size="13" fill="#3C3489">ChatMessageService</text>

  <rect x="322" y="396" width="178" height="40" rx="6" fill="#ffffff" stroke="#AFA9EC"/>
  <text x="411" y="421" text-anchor="middle" font-size="13" fill="#3C3489">EscalationService</text>
  <rect x="511" y="396" width="178" height="40" rx="6" fill="#ffffff" stroke="#AFA9EC"/>
  <text x="600" y="421" text-anchor="middle" font-size="13" fill="#3C3489">AgentService</text>
  <rect x="700" y="396" width="168" height="40" rx="6" fill="#ffffff" stroke="#AFA9EC"/>
  <text x="784" y="421" text-anchor="middle" font-size="13" fill="#3C3489">ChatSessionService</text>

  <!-- controllers -> services -->
  <line x1="447" y1="283" x2="447" y2="310" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="742" y1="283" x2="742" y2="310" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Scheduler -->
  <rect x="310" y="500" width="170" height="80" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1.2"/>
  <text x="395" y="528" text-anchor="middle" font-size="14" font-weight="600" fill="#444441">SLA job</text>
  <text x="395" y="548" text-anchor="middle" font-size="12" fill="#5F5E5A">runs every 60s</text>
  <text x="395" y="565" text-anchor="middle" font-size="11" fill="#5F5E5A">queue 5m · no reply 3m</text>
  <line x1="395" y1="500" x2="395" y2="454" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Events -->
  <rect x="510" y="500" width="190" height="80" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/>
  <text x="605" y="528" text-anchor="middle" font-size="14" font-weight="600" fill="#712B13">Spring events</text>
  <text x="605" y="548" text-anchor="middle" font-size="11" fill="#993C1D">Assigned · Escalated · Resolved</text>
  <text x="605" y="565" text-anchor="middle" font-size="11" fill="#993C1D">listeners → NotificationService</text>
  <line x1="605" y1="454" x2="605" y2="498" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Email -->
  <rect x="730" y="500" width="150" height="80" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/>
  <text x="805" y="528" text-anchor="middle" font-size="14" font-weight="600" fill="#712B13">Email service</text>
  <text x="805" y="548" text-anchor="middle" font-size="12" fill="#993C1D">@Async, HTML</text>
  <text x="805" y="565" text-anchor="middle" font-size="11" fill="#993C1D">templates</text>
  <line x1="700" y1="540" x2="728" y2="540" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Data stores -->
  <rect x="965" y="170" width="205" height="130" rx="10" fill="#EAF3DE" stroke="#639922" stroke-width="1.2"/>
  <text x="1067" y="200" text-anchor="middle" font-size="15" font-weight="600" fill="#27500A">PostgreSQL 16</text>
  <text x="1067" y="224" text-anchor="middle" font-size="12" fill="#3B6D11">tickets · agents</text>
  <text x="1067" y="242" text-anchor="middle" font-size="12" fill="#3B6D11">messages · chat_sessions</text>
  <text x="1067" y="266" text-anchor="middle" font-size="11" fill="#3B6D11">Flyway migrations</text>
  <text x="1067" y="283" text-anchor="middle" font-size="11" fill="#3B6D11">row locks for ticket routing</text>

  <rect x="965" y="340" width="205" height="115" rx="10" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1.2"/>
  <text x="1067" y="370" text-anchor="middle" font-size="15" font-weight="600" fill="#791F1F">Redis 7</text>
  <text x="1067" y="394" text-anchor="middle" font-size="12" fill="#A32D2D">agent presence (30s TTL)</text>
  <text x="1067" y="412" text-anchor="middle" font-size="12" fill="#A32D2D">ticket rate limiter</text>
  <text x="1067" y="436" text-anchor="middle" font-size="11" fill="#A32D2D">2 tickets / 2 min / IP</text>

  <rect x="965" y="500" width="205" height="80" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="1.2"/>
  <text x="1067" y="534" text-anchor="middle" font-size="15" font-weight="600" fill="#444441">SMTP server</text>
  <text x="1067" y="556" text-anchor="middle" font-size="12" fill="#5F5E5A">email delivery</text>

  <!-- Services -> data -->
  <polyline points="880,350 925,350 925,235 963,235" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="880" y1="400" x2="963" y2="400" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="880" y1="540" x2="963" y2="540" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Legend -->
  <text x="30" y="650" font-size="11" fill="#888">Clients talk to the backend over REST and STOMP/WebSocket. Docker Compose runs PostgreSQL and Redis; the SLA job and email service run inside the same Spring Boot process.</text>
</svg>
